<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>嘉北國小自治市小市長線上投票</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="./candidates.config.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
    :root {
      --bg-a: #f8fafc;
      --bg-b: #ecfeff;
      --bg-c: #fff7ed;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --accent: #f97316;
      --card-border: #ccfbf1;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background:
        radial-gradient(circle at 8% 14%, #fde68a 0%, transparent 28%),
        radial-gradient(circle at 92% 8%, #bae6fd 0%, transparent 22%),
        radial-gradient(circle at 90% 88%, #c4b5fd 0%, transparent 24%),
        radial-gradient(circle at 14% 82%, #86efac 0%, transparent 22%),
        linear-gradient(135deg, #f0f9ff 0%, #ecfeff 40%, #fff7ed 100%);
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      min-height: 100vh;
      position: relative;
    }
    .zhuyin-container { display:inline-flex; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; gap:0 0.12em; width:max-content; max-width:100%; }
    .word-group { display:flex; flex-direction:row; align-items:center; justify-content:center; }
    .hanzi-track { font-size:1em; line-height:1; font-weight:900; }
    .zhuyin-track { writing-mode:vertical-rl; text-orientation:upright; display:grid; font-size:0.35em; grid-template-rows:1em 1em; align-items:center; justify-items:center; color:#334155; font-weight:900; margin-left:0.05em; overflow:visible; }
    .zy-char,.zy-light { line-height:1; }
    .zy-tone { font-size:0.8em; position:relative; top:-0.2em; }
    .candidate-card {
      background: rgba(255,255,255,0.92);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 10px 20px rgba(15,118,110,0.08);
      transition: all 0.2s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .candidate-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(249,115,22,0.25), 0 14px 26px rgba(249,115,22,0.18);
      transform: translateY(-2px);
    }
    .avatar-img { border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,0.08); object-fit:cover; background:#f1f5f9; }
    .hidden-fade { opacity:0; pointer-events:none; transition:opacity 0.25s; }
    .show-fade { opacity:1; pointer-events:auto; transition:opacity 0.25s; }
    .glass-modal { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border: 1px solid #cffafe; }
    .particle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 999px;
      opacity: 0.55;
      filter: blur(0.5px);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(8vh) translateX(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.58; }
      100% { transform: translateY(-110vh) translateX(40px) rotate(240deg); opacity: 0; }
    }
    .sticker {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      animation: bob 4.6s ease-in-out infinite;
    }
    .sticker-right { right: 14px; bottom: 78px; width: 130px; }
    .sticker-left { left: 10px; top: 96px; width: 110px; animation-delay: -1.2s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-9px) rotate(3deg); }
    }
    .main-shell { position: relative; z-index: 2; }
    .title-badge {
      background: linear-gradient(90deg, #0ea5e9, #14b8a6);
      color: white;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 900;
      box-shadow: 0 8px 16px rgba(14, 165, 233, 0.22);
    }
    .candidate-card { animation: cardIn .45s ease both; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .candidate-card:hover { transform: translateY(-4px) rotate(-0.3deg); }
    .cta-pulse { animation: pulseBig 1.6s ease-in-out infinite; }
    @keyframes pulseBig {
      0%, 100% { box-shadow: 0 8px 20px rgba(249,115,22,0.25); }
      50% { box-shadow: 0 12px 30px rgba(249,115,22,0.45); }
    }
    .class-badge-zy .zhuyin-track {
      margin-left: 0.28em;
      font-size: 0.3em;
    }
    .class-badge-zy .word-group {
      margin-right: 0.08em;
      align-items: flex-start;
    }
    .class-badge-zy .hanzi-track {
      line-height: 1.08;
    }
    .screen-wrap { width: 100%; max-width: 1280px; margin: 0 auto; }
    @media (min-width: 900px) and (orientation: landscape) {
      body { padding: 12px 20px; }
      header { margin-bottom: 10px !important; }
      .screen-wrap { max-width: 1360px; }
      #candidate-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .candidate-card { border-radius: 18px; padding: 10px !important; }
      .candidate-card .text-2xl { font-size: 1.25rem; }
      .candidate-card img { width: 4.25rem !important; height: 4.25rem !important; }
      .candidate-card .zhuyin-track { font-size: 0.42em; }
      footer { margin-top: 12px !important; }
      #btn-main-vote { padding: 10px 40px !important; font-size: 1.5rem !important; }
      .sticker-right { width: 110px; right: 10px; bottom: 66px; }
      .sticker-left { width: 92px; left: 8px; top: 84px; }
    }
  </style>
</head>
<body class="px-4 py-4">
  <div id="particle-layer" class="particle-layer"></div>
  <img src="./assets/sticker-star.png" class="sticker sticker-left" alt="星星裝飾">
  <img src="./assets/sticker-pencil.png" class="sticker sticker-right" alt="鉛筆裝飾">
  <div class="main-shell">
  <header class="screen-wrap mb-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-white/95 border-2 border-cyan-200 rounded-2xl px-2 py-1 shadow-md">
          <img src="./chiapei.png" class="h-12 md:h-14 w-auto object-contain" alt="學校logo">
        </div>
        <h1 class="text-2xl md:text-4xl font-black text-slate-800 drop-shadow-sm">
          <span class="auto-zy" data-text="嘉北國小" data-zy="ㄐㄧㄚ ㄅㄟˇ ㄍㄨㄛˊ ㄒㄧㄠˇ"></span>
          <span class="auto-zy" data-text="自治小市長選舉" data-zy="ㄗˋ ㄓˋ ㄒㄧㄠˇ ㄕˋ ㄓㄤˇ ㄒㄩㄢˇ ㄐㄩˇ"></span>
        </h1>
      </div>
      <button onclick="openAdminModal()" class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2 rounded-xl">
        <i class="fa-solid fa-user-shield mr-1"></i>管理者
      </button>
    </div>
    <div class="mt-3 flex items-center gap-2 bg-white/90 px-5 py-2 rounded-full border border-teal-100 w-fit max-w-full">
      <i class="fa-solid fa-bell text-orange-500"></i>
      <span class="text-lg font-black text-slate-700 auto-zy" data-text="只能選一組，選好後請按確定投票" data-zy="ㄓˇ ㄋㄥˊ ㄒㄩㄢˇ ㄧˋ ㄗㄨˇ ， ㄒㄩㄢˇ ㄏㄠˇ ㄏㄡˋ ㄑㄧㄥˇ ㄢˋ ㄑㄩㄝˋ ㄉㄧㄥˋ ㄊㄡˊ ㄆㄧㄠˋ"></span>
    </div>
    <div class="mt-2 title-badge">超級小公民，一人一票最公平</div>
  </header>

  <main class="screen-wrap">
    <div id="candidate-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
  </main>

  <footer class="text-center mt-6">
    <button id="btn-main-vote" onclick="handleVoteClick()" class="cta-pulse bg-orange-500 hover:bg-orange-600 text-white text-2xl font-black py-4 px-12 rounded-full shadow-lg">
      <span id="btn-vote-text" class="auto-zy" data-text="確定投票" data-zy="ㄑㄩㄝˋ ㄉㄧㄥˋ ㄊㄡˊ ㄆㄧㄠˋ"></span>
    </button>
  </footer>

  <div id="modal-error" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 hidden-fade">
    <div class="glass-modal p-6 rounded-3xl text-center w-11/12 max-w-sm">
      <h2 class="text-3xl font-black text-slate-800 mb-4 auto-zy" data-text="請先點選候選人" data-zy="ㄑㄧㄥˇ ㄒㄧㄢ ㄉㄧㄢˇ ㄒㄩㄢˇ ㄏㄡˋ ㄒㄩㄢˇ ㄖㄣˊ"></h2>
      <button onclick="closeModal('modal-error')" class="bg-slate-700 text-white text-2xl font-bold py-2 px-6 rounded-full">知道了</button>
    </div>
  </div>

  <div id="modal-confirm" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden-fade">
    <div class="glass-modal p-6 rounded-3xl text-center w-11/12 max-w-2xl">
      <h2 class="text-3xl font-black text-slate-800 mb-5">確定要投給這一組嗎？</h2>
      <div class="bg-cyan-50 border border-cyan-200 rounded-2xl p-4 mb-5">
        <div id="confirm-num-wrapper" class="inline-block px-4 py-1 rounded-full bg-teal-700 text-white text-2xl font-black mb-4"></div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <img id="confirm-img-m" src="" class="w-24 h-24 mx-auto rounded-full avatar-img mb-2" alt="正候選人">
            <div class="text-sm bg-amber-100 text-amber-700 inline-block px-2 rounded">正</div>
            <div id="confirm-name-m" class="text-3xl text-slate-800 mt-2"></div>
          </div>
          <div>
            <img id="confirm-img-v" src="" class="w-24 h-24 mx-auto rounded-full avatar-img mb-2" alt="副候選人">
            <div class="text-sm bg-slate-100 text-slate-700 inline-block px-2 rounded">副</div>
            <div id="confirm-name-v" class="text-3xl text-slate-800 mt-2"></div>
          </div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal('modal-confirm')" class="flex-1 py-3 rounded-2xl border border-slate-200 text-slate-600 text-xl font-bold">取消</button>
        <button id="btn-final-submit" onclick="submitVote()" class="flex-1 py-3 rounded-2xl bg-emerald-500 text-white text-xl font-bold">確定</button>
      </div>
    </div>
  </div>

  <div id="modal-success" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white hidden-fade">
    <h1 class="text-6xl font-black text-emerald-600 mb-5">完成投票</h1>
    <p class="text-2xl text-slate-500">即將回到首頁...</p>
  </div>

  <div id="modal-admin" class="fixed inset-0 z-[120] flex items-center justify-center bg-black/50 hidden-fade">
    <div class="glass-modal p-6 rounded-3xl w-11/12 max-w-3xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-black text-slate-800">管理者票數查詢</h2>
        <button onclick="closeModal('modal-admin')" class="text-slate-500"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <div id="admin-login-area">
        <p class="text-slate-600 mb-3">請使用 Google 帳號登入管理後台</p>
        <button onclick="adminGoogleLogin()" class="bg-teal-700 text-white px-5 py-2 rounded-xl font-bold">
          <i class="fa-brands fa-google mr-1"></i>使用 Google 登入
        </button>
        <p id="admin-login-msg" class="text-red-600 mt-2"></p>
      </div>

      <div id="admin-stats-area" class="hidden">
        <div class="flex gap-2 mb-3 flex-wrap">
          <button onclick="loadVoteStats()" class="bg-orange-500 text-white px-4 py-2 rounded-xl font-bold">重新整理票數</button>
          <button onclick="exportAllVotes()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold">匯出全部投票</button>
          <button onclick="clearAllVotes()" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold">刪除全部投票</button>
          <button onclick="adminLogout()" class="bg-slate-600 text-white px-4 py-2 rounded-xl font-bold">登出</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border border-slate-200 rounded-xl overflow-hidden">
            <thead class="bg-slate-100">
              <tr>
                <th class="p-2">號次</th>
                <th class="p-2">正候選人</th>
                <th class="p-2">副候選人</th>
                <th class="p-2">票數</th>
              </tr>
            </thead>
            <tbody id="stats-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDG552C-No6-tw0bvtpM6ASdIF7BMtLtFg",
      authDomain: "school-vote-2026-47364.firebaseapp.com",
      projectId: "school-vote-2026-47364",
      storageBucket: "school-vote-2026-47364.firebasestorage.app",
      messagingSenderId: "716763807399",
      appId: "1:716763807399:web:c99e4e9dfc5620863b6582"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    const db = getFirestore(app);

    const candidatesData = (window.CANDIDATES_CONFIG || []).map(c => ({
      id: c.number,
      class: c.className,
      mayor: { chars: Array.from(c.mayor.name), zhuyin: c.mayor.zhuyin, img: ensureJpg(c.mayor.image) },
      vice: { chars: Array.from(c.vice.name), zhuyin: c.vice.zhuyin, img: ensureJpg(c.vice.image) }
    }));

    function ensureJpg(filename) {
      return filename.replace(/\.(png|jpeg)$/i, '.jpg');
    }

    let selectedCandidateId = null;

    const parseZhuyin = (str) => {
      if (!str) return { chars: [], tone: '', type: '' };
      const lightTone = '˙';
      const standardTones = ['ˊ', 'ˇ', 'ˋ'];
      let charsStr = str, tone = '', type = '';
      if (str.includes(lightTone)) { charsStr = str.replace(lightTone, ''); tone = lightTone; type = 'light'; }
      else {
        for (const t of standardTones) {
          if (str.includes(t)) { charsStr = str.replace(t, ''); tone = t; type = 'standard'; break; }
        }
      }
      return { chars: Array.from(charsStr.trim()), tone, type };
    };

    function buildAdvancedZhuyinHTML(charsArray, zhuyinsArray) {
      const zhuyinSpacing = 1.1, zhuyinSqueeze = 0.1;
      let html = '<div class="zhuyin-container">';
      for (let i = 0; i < charsArray.length; i++) {
        const char = charsArray[i], zhuyin = zhuyinsArray[i] || '';
        if (!char) continue;
        const { chars, tone, type } = parseZhuyin(zhuyin);
        if (chars.length === 0 && tone === '') { html += `<div class="word-group"><div class="hanzi-track">${char}</div></div>`; continue; }
        let zhuyinCells = [], colIndex = 1;
        const slotsCount = chars.length + (type === 'light' ? 1 : 0);
        const currentSpacing = Math.max(0.4, slotsCount > 1 ? zhuyinSpacing - (slotsCount - 1) * zhuyinSqueeze : zhuyinSpacing);
        if (type === 'light') { zhuyinCells.push(`<div class="zy-light" style="grid-row:2;grid-column:${colIndex};">${tone}</div>`); colIndex++; }
        chars.forEach((c, idx) => {
          zhuyinCells.push(`<div class="zy-char" style="grid-row:2;grid-column:${colIndex};">${c}</div>`);
          if (idx === chars.length - 1 && type === 'standard') zhuyinCells.push(`<div class="zy-tone" style="grid-row:1;grid-column:${colIndex};">${tone}</div>`);
          colIndex++;
        });
        const zhuyinTrack = zhuyinCells.length > 0 ? `<div class="zhuyin-track" style="grid-auto-columns:${currentSpacing.toFixed(2)}em;">${zhuyinCells.join('')}</div>` : '';
        html += `<div class="word-group"><div class="hanzi-track">${char}</div>${zhuyinTrack}</div>`;
      }
      return `${html}</div>`;
    }

    function initAutoZhuyin() {
      document.querySelectorAll('.auto-zy').forEach(el => {
        const text = el.getAttribute('data-text') || '';
        const zy = el.getAttribute('data-zy') || '';
        el.innerHTML = buildAdvancedZhuyinHTML(Array.from(text), zy.trim() ? zy.trim().split(' ') : []);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('candidate-grid');
      grid.innerHTML = '';
      candidatesData.forEach(cand => {
        const classText = `${cand.class}班`;
        grid.innerHTML += `
          <div id="card-${cand.id}" onclick="window.selectCandidate(${cand.id})" class="candidate-card p-3 relative">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
              <div class="bg-teal-700 text-white w-10 h-10 rounded-full flex items-center justify-center font-black text-xl">${cand.id}</div>
              <div class="text-slate-600 bg-slate-100 rounded-full px-3 py-1 font-bold tracking-wider">${classText}</div>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <div class="text-center">
                <img src="${cand.mayor.img}" class="w-20 h-20 rounded-full avatar-img mx-auto mb-1" alt="正候選人">
                <div class="text-xs bg-amber-100 text-amber-700 inline-block px-2 rounded">正</div>
                <div class="text-2xl text-slate-800 mt-1">${buildAdvancedZhuyinHTML(cand.mayor.chars, cand.mayor.zhuyin)}</div>
              </div>
              <div class="text-center">
                <img src="${cand.vice.img}" class="w-20 h-20 rounded-full avatar-img mx-auto mb-1" alt="副候選人">
                <div class="text-xs bg-slate-100 text-slate-700 inline-block px-2 rounded">副</div>
                <div class="text-2xl text-slate-800 mt-1">${buildAdvancedZhuyinHTML(cand.vice.chars, cand.vice.zhuyin)}</div>
              </div>
            </div>
            <div class="check-mark absolute top-2 right-2 w-8 h-8 rounded-full bg-emerald-500 text-white hidden items-center justify-center"><i class="fa-solid fa-check"></i></div>
          </div>`;
      });
    }

    window.selectCandidate = (id) => {
      selectedCandidateId = id;
      document.querySelectorAll('.candidate-card').forEach(card => {
        card.classList.remove('selected');
        card.querySelector('.check-mark').classList.add('hidden');
      });
      const target = document.getElementById(`card-${id}`);
      target.classList.add('selected');
      target.querySelector('.check-mark').classList.remove('hidden');
      target.querySelector('.check-mark').classList.add('flex');
    };

    window.handleVoteClick = () => {
      if (!selectedCandidateId) return openModal('modal-error');
      const cand = candidatesData.find(c => c.id === selectedCandidateId);
      document.getElementById('confirm-num-wrapper').textContent = String(cand.id);
      document.getElementById('confirm-img-m').src = cand.mayor.img;
      document.getElementById('confirm-img-v').src = cand.vice.img;
      document.getElementById('confirm-name-m').innerHTML = buildAdvancedZhuyinHTML(cand.mayor.chars, cand.mayor.zhuyin);
      document.getElementById('confirm-name-v').innerHTML = buildAdvancedZhuyinHTML(cand.vice.chars, cand.vice.zhuyin);
      openModal('modal-confirm');
    };

    const withTimeout = (promise, ms = 12000) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('投票送出逾時，請檢查網路後再試一次。')), ms))
    ]);

    window.submitVote = async () => {
      const cand = candidatesData.find(c => c.id === selectedCandidateId);
      const btn = document.getElementById('btn-final-submit');
      btn.disabled = true;
      btn.textContent = '傳送中...';
      try {
        await withTimeout(addDoc(collection(db, 'votes'), {
          candidateNumber: cand.id,
          mayorName: cand.mayor.chars.join(''),
          viceName: cand.vice.chars.join(''),
          className: cand.class,
          createdAt: serverTimestamp()
        }));
        closeModal('modal-confirm');
        openModal('modal-success');
        fireConfetti();
        setTimeout(resetSystem, 2500);
      } catch (err) {
        alert(`投票失敗：${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '確定';
      }
    };

    function resetSystem() {
      selectedCandidateId = null;
      renderGrid();
      closeModal('modal-success');
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('hidden-fade');
      modal.classList.add('show-fade');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('show-fade');
      modal.classList.add('hidden-fade');
    }

    window.openModal = openModal;
    window.closeModal = closeModal;
    window.openAdminModal = async () => {
      if (auth.currentUser) {
        openModal('modal-admin');
        return;
      }
      await adminGoogleLogin(true);
    };

    function fireConfetti() {
      const end = Date.now() + 1800;
      (function frame() {
        confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#14b8a6','#f97316','#22c55e'] });
        confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#14b8a6','#f97316','#22c55e'] });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    async function adminGoogleLogin(openOnSuccess = false) {
      const msg = document.getElementById('admin-login-msg');
      msg.textContent = '';
      try {
        await signInWithPopup(auth, googleProvider);
        await loadVoteStats();
        if (openOnSuccess) openModal('modal-admin');
      } catch (err) {
        msg.textContent = `登入失敗：${err.message}`;
        if (openOnSuccess) openModal('modal-admin');
      }
    }
    window.adminGoogleLogin = adminGoogleLogin;

    window.adminLogout = async () => {
      await signOut(auth);
    };

    window.exportAllVotes = async () => {
      try {
        const snap = await getDocs(collection(db, 'votes'));
        const rows = [['candidateNumber', 'mayorName', 'viceName', 'className', 'createdAt', 'docId']];
        snap.forEach(d => {
          const v = d.data();
          const createdAt = v.createdAt?.toDate ? v.createdAt.toDate().toISOString() : '';
          rows.push([v.candidateNumber ?? '', v.mayorName ?? '', v.viceName ?? '', v.className ?? '', createdAt, d.id]);
        });
        const csv = rows.map(r => r.map(val => `"${String(val).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `votes_export_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert(`匯出失敗：${err.message}`);
      }
    };

    window.clearAllVotes = async () => {
      if (!auth.currentUser) {
        alert('請先以管理者登入。');
        return;
      }
      const ok = confirm('確定要刪除所有投票結果嗎？此動作無法復原。');
      if (!ok) return;
      try {
        const snap = await getDocs(collection(db, 'votes'));
        await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
        await loadVoteStats();
        alert('已刪除全部投票結果。');
      } catch (err) {
        alert(`刪除失敗：${err.message}`);
      }
    };

    async function loadVoteStats() {
      const snap = await getDocs(collection(db, 'votes'));
      const countMap = new Map(candidatesData.map(c => [c.id, 0]));
      snap.forEach(doc => {
        const vote = doc.data();
        countMap.set(vote.candidateNumber, (countMap.get(vote.candidateNumber) || 0) + 1);
      });
      const body = document.getElementById('stats-table-body');
      body.innerHTML = candidatesData.map(c => `
        <tr class="border-t border-slate-100">
          <td class="p-2 font-bold">${c.id}</td>
          <td class="p-2">${c.mayor.chars.join('')}</td>
          <td class="p-2">${c.vice.chars.join('')}</td>
          <td class="p-2 font-black text-teal-700">${countMap.get(c.id) || 0}</td>
        </tr>`).join('');
    }
    window.loadVoteStats = loadVoteStats;

    onAuthStateChanged(auth, async user => {
      const loginArea = document.getElementById('admin-login-area');
      const statsArea = document.getElementById('admin-stats-area');
      if (user) {
        loginArea.classList.add('hidden');
        statsArea.classList.remove('hidden');
        await loadVoteStats();
      } else {
        loginArea.classList.remove('hidden');
        statsArea.classList.add('hidden');
      }
    });

    renderGrid();
    initAutoZhuyin();
    initParticles();

    function initParticles() {
      const layer = document.getElementById('particle-layer');
      const colors = ['#22d3ee', '#38bdf8', '#f97316', '#f472b6', '#34d399', '#facc15'];
      for (let i = 0; i < 26; i++) {
        const orb = document.createElement('div');
        orb.className = 'orb';
        const size = Math.random() * 14 + 8;
        orb.style.width = `${size}px`;
        orb.style.height = `${size}px`;
        orb.style.background = colors[Math.floor(Math.random() * colors.length)];
        orb.style.left = `${Math.random() * 100}vw`;
        orb.style.bottom = `${-20 - Math.random() * 60}px`;
        orb.style.animationDuration = `${12 + Math.random() * 14}s`;
        orb.style.animationDelay = `${Math.random() * -18}s`;
        layer.appendChild(orb);
      }
    }
  </script>
  </div>
</body>
</html>
